spring.application.name=aviation-api

# Database (MySQL / AWS RDS)
spring.datasource.url=jdbc:mysql://localhost:3306/aviation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Basic Auth credentials for the API 
app.security.username=admin
app.security.password=aviation123

# CORS
# Comma-separated list of origins allowed to call this API. Override with APP_CORS_ALLOWED_ORIGINS when deployed
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

server.port=8080
